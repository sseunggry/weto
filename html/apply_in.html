<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <meta name="keywords" content="" />
        <meta name="description" content="" />
        <meta name="format-detection" content="telephone=no" />
        <link rel="apple-touch-icon" sizes="180x180" href="../assets/img/favicon_180.png" />
        <link rel="icon" type="image/png" sizes="512x512" href="../assets/img/favicon_512.png" />
        <link rel="icon" type="image/png" sizes="192x192" href="../assets/img/favicon_192.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon_32.png" />
        <title>Weto</title>
        <!-- css -->
        <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css"> 
        <link href="../assets/css/style.css" type="text/css" rel="stylesheet" />
        <!-- script -->
        <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script> 
        <script defer src="../assets/js/jquery-2.2.4.min.js"></script>
        <script defer src="../assets/js/common.js"></script>
    </head>

    <body>
        <div class="wrap apply">
            <div class="container">
                <!-- 헤더 영역 -->
                <header class="header">
                    <div class="inner">
                        <h1 class="logo"><span class="blind">Weto</span></h1>
                        <button class="btn-menu mo-only"><span class="blind">menu</span></button>
                        <div class="nav-wrap">
                            <div class="nav-scroll-area">
                                <div class="nav-inner">
                                    <ul class="nav">
                                        <li><a href="https://wallet.weto.asia/">Wallet</a></li>
                                        <li><a href="../assets/pdf/weto whitepaper_KR.pdf" download="weto whitepaper_KR.pdf">Whitepaper</a></li>
                                        <li><a href="./apply_in.html">Buy Weto</a></li>
                                    </ul>
                                    <div class="lang">
                                        <select class="select">
                                            <option value="ko">KO</option>
                                            <option value="en">EN</option>
                                            <option value="in" selected>IN</option>
                                            <option value="zh">ZH</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <button class="btn-close mo-only"><span class="blind">close</span></button>
                        </div>
                    </div>
                </header>
                <!-- //헤더 영역 -->

                <!-- 컨텐츠 영역 -->
                <div class="contents">
                    <section class="sub-sec-kv">
                        <div class="inner">
                            <div class="txt-wrap">
                                <h2 class="tit">
                                    Acara Penjualan <br/>
                                    <strong>WETO TOKEN Diskon 50%</strong>
                                </h2>
                            </div>
                        </div>
                    </section>

                    <section class="sub-sec-01">
                        <div class="inner">
                            <div class="sec-tit">
                                <h3 class="tit">Formulir Pembelian Weto</h3>
                            </div>
                            <form action="" class="form">
                                <div class="form-list">
                                    <div class="input-wrap">
                                        <label for="input_1" class="label">Pembeli</label>
                                        <div class="input">
                                            <input type="text" placeholder="Tulis Nama" id="input_1">
                                        </div>
                                    </div>
                                    <div class="input-wrap">
                                        <label for="input_2" class="label">Email</label>
                                        <div class="input">
                                            <input type="text" placeholder="Tulis Email" id="input_2">
                                        </div>
                                    </div>
                                    <div class="input-wrap">
                                        <label for="input_3" class="label">Jumlah Pembelian (WETO)</label>
                                        <div class="input small">
                                            <input type="text" value="0" id="input_3">
                                            <div class="btn-count">
                                                <button type="button" class="increase"></button>
                                                <button type="button" class="decrease"></button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="input-wrap">
                                        <label for="input_4" class="label">Jumlah Deposit (USDT)</label>
                                        <div class="input">
                                            <input type="number" placeholder="0" id="input_4" disabled>
                                        </div>
                                    </div>
                                    <div class="input-wrap">
                                        <label for="input_5" class="label">Alamat Penerima Pengguna</label>
                                        <div class="input">
                                            <input type="text" placeholder="Masukkan Alamat" id="input_5">
                                            <button type="button" class="btn-copy"><span class="blind">copy</span></button>
                                        </div>
                                    </div>
                                    <div class="input-wrap">
                                        <label for="input_6" class="label">Alamat Pengiriman USDT <br/>(BNB smart Chain)</label>
                                        <div class="input">
                                            <input type="text" placeholder="Masukkan Alamat" id="input_6">
                                            <button type="button" class="btn-copy"><span class="blind">copy</span></button>
                                        </div>
                                    </div>
                                </div>

                                <div class="btn-wrap flex-end">
                                    <button type="submit" class="btn large primary">Ajukan</button>
                                </div>
                            </form>
                        </div>
                    </section>
                </div>
                <!--//컨텐츠 영역 -->

                <!-- 푸터 영역 -->
                <div class="footer">
                    <div class="inner">
                        <ul class="info">
                            <li>Email: <a href="mailto: help@weto.asia">help@weto.asia</a></li>
                        </ul>
                        <p class="copyright">© 2025 WETO All rights reserved.</p>
                    </div>
                </div>
                <!-- //푸터 영역 -->
            </div>
        </div>
    </body>
</html>
